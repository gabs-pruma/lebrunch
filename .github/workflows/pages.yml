# Publica o site no GitHub Pages a cada push na branch de prévia.
#
# O export estático (`output: "export"` no next.config.ts) sai em `out/`.
# `NEXT_PUBLIC_BASE_PATH` recebe "/<repositório>" porque a prévia mora em
# usuario.github.io/<repositório>/. Quando o domínio próprio for apontado
# para o Pages, troque para "" (e o site deixa de sair com noindex).
name: GitHub Pages

on:
  push:
    branches: [feat/v2-do-site, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
