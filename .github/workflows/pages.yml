# Publica o site no GitHub Pages a cada push na branch de prévia.
#
# O export estático (`output: "export"` no next.config.ts) sai em `out/`.
# `NEXT_PUBLIC_BASE_PATH` vem do próprio Pages (`configure-pages`): é
# "/<repositório>" enquanto o site mora em usuario.github.io/<repositório>/
# — a prévia, com noindex — e fica vazio quando o domínio próprio está
# configurado em Settings → Pages. Trocar o domínio não dispara build:
# depois de configurá-lo, rode este workflow de novo (Actions → Run).
name: GitHub Pages

on:
  push:
    branches: [feat/v2-do-site, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
